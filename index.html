        <!-- MoviesNCH.online AdShield & Pop-up Terminator Engine -->
    <script>
      (function() {
        window.__AD_SHIELD_BLOCKED_COUNT = 0;
        
        // 1. Intercept and completely neutralize window.open popups
        try {
          const noopWindow = {
            closed: true,
            focus: function() {},
            blur: function() {},
            close: function() {},
            location: { href: "about:blank" }
          };

          try {
            Object.defineProperty(window, 'open', {
              configurable: false,
              writable: false,
              value: function(url, target, features) {
                window.__AD_SHIELD_BLOCKED_COUNT = (window.__AD_SHIELD_BLOCKED_COUNT || 0) + 1;
                console.warn("[MoviesNCH AdShield] 🛡️ Blocked popup window.open attempt:", url);
                try {
                  window.dispatchEvent(new CustomEvent("adshield:blocked", { detail: { type: "popup", url } }));
                } catch(e) {}
                return noopWindow;
              }
            });
          } catch(err) {
            window.open = function() { return noopWindow; };
          }
        } catch(e) {}

        // 2. Prevent window top-level navigation hijacks and popunders
        window.addEventListener("beforeunload", function(e) {
          delete e.returnValue;
        }, { capture: true });

        // 3. Keep focus in MoviesNCH if rogue tab attempts to unfocus
        window.addEventListener("blur", function() {
          setTimeout(function() {
            try { window.focus(); } catch(e) {}
          }, 30);
        });

        // 4. Prevent programmatic click hijacking on foreign anchors
        document.addEventListener("click", function(e) {
          const target = e.target && e.target.closest ? e.target.closest("a") : null;
          if (target) {
            const href = target.getAttribute("href") || "";
            const targetAttr = target.getAttribute("target") || "";
            const isInternal = href.startsWith("/") || href.startsWith("#") || href.includes(window.location.hostname);
            const isAllowed = href.startsWith("magnet:") || href.includes("imdb.com") || href.includes("omdbapi.com") || href.includes("yts.mx") || href.includes("1337x.to");
            
            if (targetAttr === "_blank" && !isInternal && !isAllowed && href.startsWith("http")) {
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              window.__AD_SHIELD_BLOCKED_COUNT = (window.__AD_SHIELD_BLOCKED_COUNT || 0) + 1;
              console.warn("[MoviesNCH AdShield] 🛡️ Blocked external ad redirect link:", href);
              try {
                window.dispatchEvent(new CustomEvent("adshield:blocked", { detail: { type: "link", url: href } }));
              } catch(err) {}
            }
          }
        }, true);
      })();
